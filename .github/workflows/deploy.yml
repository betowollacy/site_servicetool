name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory /opt/site_servicetool
            cd /opt/site_servicetool
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            systemctl restart servicetool.service
            echo "Deploy concluído"
      - name: Notificar falha no Telegram
        if: failure()
        run: |
          curl -s -o /dev/null -w '%{http_code}' \
            "https://api.telegram.org/bot${{ secrets.DEPLOY_TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.DEPLOY_TG_CHAT_ID }}" \
            --data-urlencode "text=FALHA no deploy de site_servicetool (@${{ github.ref_name }}, commit ${{ github.sha }})"
        continue-on-error: true