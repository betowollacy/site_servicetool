<div class="card orion-service-card mb-3">
    <div class="card-body d-flex align-items-center gap-3 py-3">
        <div class="orion-service-thumb">
            <img src="{{ item.thumbnail }}" alt="" width="64" height="48" class="rounded">
        </div>
        <div class="flex-grow-1">
            <a href="{% url 'service_view' item.slug %}" class="d-block fw-semibold text-white mb-1">{{ item.title }}</a>
            <div class="d-flex flex-wrap gap-2">
                <span class="badge">R$ {{ item.price|floatformat:2 }}</span>
                <span class="badge">{{ item.delivery_time }}</span>
                <a href="{% url 'category' item.category_slug %}" class="badge text-decoration-none">{{ item.service_type_display }}</a>
            </div>
        </div>
        <a href="{% url 'service_view' item.slug %}" class="btn btn-light-primary rounded-circle"><i class="fas fa-arrow-right"></i></a>
    </div>
</div>
